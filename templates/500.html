{% extends 'base.html' %}
{% block title %}Something Went Wrong - Coffee Shop{% endblock %}
{% block page %}500{% endblock %}
{% block content %}
<main class="max-w-container-max mx-auto px-margin-mobile md:px-lg py-xl min-h-[70vh] flex flex-col items-center justify-center text-center">
  <span aria-hidden="true" class="material-symbols-outlined text-[80px] text-secondary mb-md">local_cafe</span>
  <h1 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-primary mb-sm">500</h1>
  <h2 class="font-headline-md text-headline-md text-primary mb-sm">Something Went Wrong</h2>
  <p class="font-body-lg text-body-lg text-on-surface-variant max-w-xl mb-xl">
    Our baristas hit a snag in the back. Please try again in a moment.
  </p>
  <a href="{% url 'menu:home' %}"
     class="inline-flex items-center justify-center bg-primary-container text-on-primary rounded-lg px-lg py-sm font-label-bold text-label-bold hover:scale-105 transition-transform duration-200 soft-shadow hover-lift">
    Back to Home
  </a>
</main>
{% endblock %}
